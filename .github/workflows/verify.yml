name: Verify HomeKind connector

on:
  push:
    branches: [main]
    paths: ['homekind_maintenance/**', 'homekind_bridge/**', 'tests/**', '.github/workflows/verify.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container and software checks (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Arm emulation
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app container
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            --build-arg BUILD_ARCH="$TARGET_ARCH" --build-arg BUILD_VERSION=0.19.0 \
            --tag homekind-connector:verify ./homekind_bridge
      - name: Verify runtime and run software checks in the built container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            --entrypoint /opt/bridge/bin/python homekind-connector:verify \
            -m py_compile /bridge.py /camera_relay.py /media_control.py /radio_directory.py /setup_server.py /managed_settings.py /device_onboarding.py /health_import.py /light_group.py /light_group_adapter.py /voice_events.py /voice_transport.py
          docker run --rm --platform "$TARGET_PLATFORM" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace --entrypoint /opt/bridge/bin/python \
            homekind-connector:verify -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify normal startup with the Supervisor environment
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run -d --name homekind-startup --platform "$TARGET_PLATFORM" \
            -e SUPERVISOR_TOKEN=synthetic-startup-test-only homekind-connector:verify
          trap 'docker logs homekind-startup; docker rm -f homekind-startup' EXIT
          for attempt in $(seq 1 30); do
            if docker exec homekind-startup /opt/bridge/bin/python -c 'import http.client; c=http.client.HTTPConnection("127.0.0.1",8099,timeout=2); c.request("GET","/"); r=c.getresponse(); assert r.status == 403, r.status'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  maintenance:
    name: Maintenance companion (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enable Arm emulation
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and check the companion
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$TARGET_PLATFORM" --load --build-arg BUILD_ARCH="$TARGET_ARCH" --build-arg BUILD_VERSION=0.2.0 --tag homekind-maintenance:verify ./homekind_maintenance
          docker run --rm --platform "$TARGET_PLATFORM" --entrypoint python3 homekind-maintenance:verify -c 'from homekind_maintenance import maintenance, windows, window_sync, window_runtime, system_updates; from zoneinfo import ZoneInfo; assert ZoneInfo("Australia/Melbourne")'
          docker run --rm --platform "$TARGET_PLATFORM" --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint python3 homekind-maintenance:verify -m unittest discover -s tests -p 'test_home_maintenance.py' -v
          docker run --rm --platform "$TARGET_PLATFORM" --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint python3 homekind-maintenance:verify -m unittest discover -s tests -p 'test_*window*.py' -v
          docker run --rm --platform "$TARGET_PLATFORM" --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" --workdir /workspace --entrypoint python3 homekind-maintenance:verify -m unittest discover -s tests -p 'test_system_updates.py' -v
